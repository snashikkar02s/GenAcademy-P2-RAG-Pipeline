[project]
name = "genacademy-p2-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swaroop Nashikkar", email = "snashikkar@colorcon.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastembed>=0.9.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
]

[project.scripts]
genacademy-p2-rag-pipeline = "genacademy_p2_rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
